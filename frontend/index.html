<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova — AI Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── Background ────────────────────────────────────────── -->
<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>
</div>

<!-- ── Layout ─────────────────────────────────────────────── -->
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-ring">
          <div class="logo-dot"></div>
        </div>
        <span class="logo-name">Nova</span>
        <span class="logo-tag">AI</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="setView('chat')" id="btnChat">
        <i class="bi bi-chat-dots-fill"></i>
        <span>Chat</span>
      </button>
      <button class="nav-item" onclick="setView('analytics')" id="btnAnalytics">
        <i class="bi bi-bar-chart-fill"></i>
        <span>Analytics</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="status-card">
        <div class="status-row">
          <span class="status-dot"></span>
          <span class="status-text">System Online</span>
        </div>
        <div class="stat-mini">
          <span id="sidebarMsgs">0</span> messages
        </div>
      </div>

      <div class="topics-list">
        <div class="topics-title">Try asking about</div>
        <button class="topic-chip" onclick="injectPrompt('Tell me a programming joke')">😄 Jokes</button>
        <button class="topic-chip" onclick="injectPrompt('What is Node.js?')">💻 Node.js</button>
        <button class="topic-chip" onclick="injectPrompt('Explain cloud deployment')">☁️ Cloud</button>
        <button class="topic-chip" onclick="injectPrompt('What can you do?')">🤖 Capabilities</button>
        <button class="topic-chip" onclick="injectPrompt('Tell me about AI')">🧠 AI & ML</button>
        <button class="topic-chip" onclick="injectPrompt('Web security tips')">🔐 Security</button>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <main class="main-area">

    <!-- ── CHAT VIEW ───────────────────────────────────────── -->
    <div class="view" id="viewChat">
      <!-- Chat header -->
      <header class="chat-header">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <div class="header-info">
          <div class="header-avatar">
            <i class="bi bi-robot"></i>
            <div class="avatar-pulse"></div>
          </div>
          <div>
            <div class="header-name">Nova</div>
            <div class="header-status"><span class="status-dot sm"></span> Online — AI Assistant</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" onclick="clearChat()" title="Clear chat">
            <i class="bi bi-trash3"></i>
          </button>
          <button class="icon-btn" onclick="exportChat()" title="Export chat">
            <i class="bi bi-download"></i>
          </button>
        </div>
      </header>

      <!-- Messages area -->
      <div class="messages-area" id="messagesArea">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Input area -->
      <footer class="input-area">
        <div class="input-wrap">
          <textarea
            id="userInput"
            class="chat-input"
            placeholder="Message Nova…"
            rows="1"
            maxlength="500"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <div class="input-meta">
            <span class="char-count" id="charCount">0/500</span>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
              <i class="bi bi-send-fill"></i>
            </button>
          </div>
        </div>
        <div class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
      </footer>
    </div>

    <!-- ── ANALYTICS VIEW ─────────────────────────────────── -->
    <div class="view" id="viewAnalytics" style="display:none;">
      <header class="chat-header">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <div class="header-info">
          <div class="header-avatar" style="background:linear-gradient(135deg,#f97316,#ef4444)">
            <i class="bi bi-bar-chart-fill"></i>
          </div>
          <div>
            <div class="header-name">Analytics</div>
            <div class="header-status">Live usage data</div>
          </div>
        </div>
        <button class="icon-btn" onclick="loadAnalytics()"><i class="bi bi-arrow-clockwise"></i></button>
      </header>

      <div class="analytics-content" id="analyticsContent">
        <div class="analytics-grid" id="analyticsGrid">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

  </main>
</div>

<script src="js/chat.js"></script>
</body>
</html>
